name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: x64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate source
        run: bun run check
      - name: Download AppImage tool
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p .cache
          case "$(uname -m)" in
            x86_64)
              tool_arch=x86_64
              tool_sha256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              ;;
            aarch64)
              tool_arch=aarch64
              tool_sha256=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              ;;
            *) echo "Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${tool_arch}.AppImage" \
            --output ".cache/appimagetool-${tool_arch}.AppImage"
          echo "${tool_sha256}  .cache/appimagetool-${tool_arch}.AppImage" | sha256sum --check --strict
          chmod +x ".cache/appimagetool-${tool_arch}.AppImage"
      - name: Build release package
        run: bun run build:release
      - name: Package Linux formats
        if: matrix.os == 'linux'
        run: bun run package:linux
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr5auth-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: pr5auth-*
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: release-artifacts/**
